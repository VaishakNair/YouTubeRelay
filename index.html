<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- FIX #1: Force the browser to send the origin header for security validation -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube Relay Fix</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div id="player-container"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');
    const container = document.getElementById('player-container');

    if (videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
      const iframe = document.createElement('iframe');
      
      const currentOrigin = window.location.origin;
      
      // Keep using the exact /embed/ pattern with the parameter
      iframe.src = `https://www.youtube.com/embed/${videoId}?origin=${encodeURIComponent(currentOrigin)}`;
      iframe.title = "YouTube video player";
      
      // FIX #2: Assign explicit properties directly to the DOM element
      iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
      
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen = true;
      
      container.appendChild(iframe);
    } else {
      container.innerHTML = "<p style='color:white; text-align:center; padding-top:20px;'>Invalid Video ID</p>";
    }
  </script>
</body>
</html>
