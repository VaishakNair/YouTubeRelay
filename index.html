<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Relay</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <div id="player-container"></div>

    <script>
      // 1. Parse the video ID from the URL query parameters (?v=VIDEO_ID)
      const urlParams = new URLSearchParams(window.location.search);
      const videoId = urlParams.get("v");

      const container = document.getElementById("player-container");

      if (videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
        // 2. Generate the safe YouTube iframe if the ID is valid
        const iframe = document.createElement("iframe");

        // CRUCIAL: Append &origin= to tell YouTube exactly where the handshake is occurring
        // Replace with your live URL domain (e.g., https://github.io)
        const currentOrigin = window.location.origin;

        iframe.src = `https://www.youtube.com/embed/${videoId}?origin=${encodeURIComponent(currentOrigin)}`;
        iframe.title = "YouTube video player";
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;

        container.appendChild(iframe);
      } else {
        container.innerHTML =
          "<p style='color:white; text-align:center; padding-top:20px;'>Invalid Video ID</p>";
      }
    </script>
  </body>
</html>
